<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" font-family="Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="1400" height="900" fill="#ffffff"/>
<defs>
  <marker id="arrowPurple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker>
  <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
  <marker id="arrowBlue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker>
  <marker id="arrowGreen" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker>
  <marker id="arrowRed" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker>
  <marker id="arrowOrange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker>
</defs>
<text x="700.0" y="40" font-size="22" font-weight="700" fill="#0f172a" text-anchor="middle">CNNClassifier — Network Architecture</text>
<text x="700.0" y="63" font-size="12" font-weight="400" fill="#64748b" text-anchor="middle">[Conv → ReLU → Pool] × 2 → Linear → Softmax, with every forward and backward pass written in NumPy  (shapes for the default 28×28×1 input)</text>
<rect x="40" y="150" width="130" height="150" rx="12" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
<text x="105.0" y="176" font-size="13.5" font-weight="700" fill="#0f172a" text-anchor="middle">Input</text>
<text x="105.0" y="195" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle" font-style="italic">28 × 28 × 1</text>
<text x="105.0" y="220" font-size="10.5" font-weight="400" fill="#334155" text-anchor="middle">global scalar</text>
<text x="105.0" y="237" font-size="10.5" font-weight="400" fill="#334155" text-anchor="middle">standardisation</text>
<rect x="200" y="116" width="350" height="218" rx="14" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.5"/>
<text x="375" y="138" font-size="13" font-weight="700" fill="#4c1d95" text-anchor="middle">Conv block 1</text>
<rect x="214" y="160" width="120" height="110" rx="10" fill="#eef2ff" stroke="#4338ca" stroke-width="2"/>
<text x="274.0" y="186" font-size="12.5" font-weight="700" fill="#312e81" text-anchor="middle">Conv 3×3</text>
<text x="274.0" y="205" font-size="10.5" font-weight="400" fill="#3730a3" text-anchor="middle" font-style="italic">4 filters</text>
<text x="274.0" y="230" font-size="10.5" font-weight="400" fill="#334155" text-anchor="middle">same padding</text>
<text x="274.0" y="247" font-size="10.5" font-weight="400" fill="#334155" text-anchor="middle">28×28×4</text>
<rect x="348" y="160" width="76" height="110" rx="10" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
<text x="386.0" y="186" font-size="12.5" font-weight="700" fill="#1e3a8a" text-anchor="middle">ReLU</text>
<rect x="438" y="160" width="98" height="110" rx="10" fill="#eef2ff" stroke="#4338ca" stroke-width="2"/>
<text x="487.0" y="186" font-size="12.5" font-weight="700" fill="#312e81" text-anchor="middle">MaxPool</text>
<text x="487.0" y="205" font-size="10.5" font-weight="400" fill="#3730a3" text-anchor="middle" font-style="italic">2×2</text>
<text x="487.0" y="230" font-size="10.5" font-weight="400" fill="#334155" text-anchor="middle">14×14×4</text>
<line x1="334" y1="215" x2="346" y2="215" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrowPurple)"/>
<line x1="424" y1="215" x2="436" y2="215" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrowPurple)"/>
<rect x="580" y="116" width="350" height="218" rx="14" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.5"/>
<text x="755" y="138" font-size="13" font-weight="700" fill="#4c1d95" text-anchor="middle">Conv block 2</text>
<rect x="594" y="160" width="120" height="110" rx="10" fill="#eef2ff" stroke="#4338ca" stroke-width="2"/>
<text x="654.0" y="186" font-size="12.5" font-weight="700" fill="#312e81" text-anchor="middle">Conv 3×3</text>
<text x="654.0" y="205" font-size="10.5" font-weight="400" fill="#3730a3" text-anchor="middle" font-style="italic">8 filters</text>
<text x="654.0" y="230" font-size="10.5" font-weight="400" fill="#334155" text-anchor="middle">same padding</text>
<text x="654.0" y="247" font-size="10.5" font-weight="400" fill="#334155" text-anchor="middle">14×14×8</text>
<rect x="728" y="160" width="76" height="110" rx="10" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
<text x="766.0" y="186" font-size="12.5" font-weight="700" fill="#1e3a8a" text-anchor="middle">ReLU</text>
<rect x="818" y="160" width="98" height="110" rx="10" fill="#eef2ff" stroke="#4338ca" stroke-width="2"/>
<text x="867.0" y="186" font-size="12.5" font-weight="700" fill="#312e81" text-anchor="middle">MaxPool</text>
<text x="867.0" y="205" font-size="10.5" font-weight="400" fill="#3730a3" text-anchor="middle" font-style="italic">2×2</text>
<text x="867.0" y="230" font-size="10.5" font-weight="400" fill="#334155" text-anchor="middle">7×7×8</text>
<line x1="714" y1="215" x2="726" y2="215" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrowPurple)"/>
<line x1="804" y1="215" x2="816" y2="215" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrowPurple)"/>
<rect x="960" y="150" width="120" height="150" rx="12" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
<text x="1020.0" y="176" font-size="13.5" font-weight="700" fill="#0f172a" text-anchor="middle">Flatten</text>
<text x="1020.0" y="195" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle" font-style="italic">7 · 7 · 8</text>
<text x="1020.0" y="220" font-size="10.5" font-weight="400" fill="#334155" text-anchor="middle">= 392</text>
<rect x="1110" y="150" width="120" height="150" rx="12" fill="#eef2ff" stroke="#4338ca" stroke-width="2"/>
<text x="1170.0" y="176" font-size="13.5" font-weight="700" fill="#312e81" text-anchor="middle">Linear</text>
<text x="1170.0" y="195" font-size="10.5" font-weight="400" fill="#3730a3" text-anchor="middle" font-style="italic">392 → 10</text>
<text x="1170.0" y="220" font-size="10.5" font-weight="400" fill="#334155" text-anchor="middle">Xavier init</text>
<rect x="1260" y="150" width="110" height="150" rx="12" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
<text x="1315.0" y="176" font-size="13.5" font-weight="700" fill="#14532d" text-anchor="middle">Softmax</text>
<text x="1315.0" y="195" font-size="10.5" font-weight="400" fill="#166534" text-anchor="middle" font-style="italic">10 classes</text>
<text x="1315.0" y="220" font-size="10.5" font-weight="400" fill="#334155" text-anchor="middle">stable</text>
<text x="1315.0" y="237" font-size="10.5" font-weight="400" fill="#334155" text-anchor="middle">softmax</text>
<line x1="172" y1="225" x2="198" y2="225" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="552" y1="225" x2="578" y2="225" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="932" y1="225" x2="958" y2="225" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="1082" y1="225" x2="1108" y2="225" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="1232" y1="225" x2="1258" y2="225" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="400" width="1330" height="420" rx="16" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
<text x="64" y="430" font-size="17" font-weight="700" fill="#1e3a8a" text-anchor="start">Training and the hand-written passes</text>
<text x="64" y="450" font-size="11" font-weight="400" fill="#1e40af" text-anchor="start" font-style="italic">mini-batch training with no autograd: each layer implements forward (__call__), backward and update</text>
<rect x="64" y="474" width="306" height="220" rx="14" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
<text x="80" y="500" font-size="14.5" font-weight="700" fill="#1e3a8a" text-anchor="start">Forward</text>
<text x="80" y="519" font-size="10.5" font-weight="400" fill="#334155" text-anchor="start" font-style="italic">ConvLayer as one matrix multiply</text>
<text x="80" y="544" font-size="10.5" font-weight="400" fill="#334155" text-anchor="start">• sliding_window_view extracts patches</text>
<text x="80" y="561" font-size="10.5" font-weight="400" fill="#334155" text-anchor="start">• (im2col) → a single matmul per layer</text>
<text x="80" y="578" font-size="10.5" font-weight="400" fill="#334155" text-anchor="start">• MaxPool caches each window's argmax</text>
<text x="80" y="595" font-size="10.5" font-weight="400" fill="#334155" text-anchor="start">• no Python loops over batch or position</text>
<rect x="389" y="474" width="306" height="220" rx="14" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
<text x="405" y="500" font-size="14.5" font-weight="700" fill="#1e3a8a" text-anchor="start">Backward</text>
<text x="405" y="519" font-size="10.5" font-weight="400" fill="#334155" text-anchor="start" font-style="italic">gradients without autograd</text>
<text x="405" y="544" font-size="10.5" font-weight="400" fill="#334155" text-anchor="start">• softmax + cross-entropy gradient</text>
<text x="405" y="561" font-size="10.5" font-weight="400" fill="#334155" text-anchor="start">• simplifies to probs − targets</text>
<text x="405" y="578" font-size="10.5" font-weight="400" fill="#334155" text-anchor="start">• conv input gradient: scatter-add</text>
<text x="405" y="595" font-size="10.5" font-weight="400" fill="#334155" text-anchor="start">• (col2im) over kernel offsets only</text>
<text x="405" y="612" font-size="10.5" font-weight="400" fill="#334155" text-anchor="start">• pool gradient routed to the argmax</text>
<rect x="714" y="474" width="306" height="220" rx="14" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
<text x="730" y="500" font-size="14.5" font-weight="700" fill="#1e3a8a" text-anchor="start">Optimiser</text>
<text x="730" y="519" font-size="10.5" font-weight="400" fill="#334155" text-anchor="start" font-style="italic">mini-batch Adam</text>
<text x="730" y="544" font-size="10.5" font-weight="400" fill="#334155" text-anchor="start">• β₁ = 0.9, β₂ = 0.999, ε = 1e-8</text>
<text x="730" y="561" font-size="10.5" font-weight="400" fill="#334155" text-anchor="start">• bias-corrected first/second moments</text>
<text x="730" y="578" font-size="10.5" font-weight="400" fill="#334155" text-anchor="start">• decoupled weight decay (alpha),</text>
<text x="730" y="595" font-size="10.5" font-weight="400" fill="#334155" text-anchor="start">• AdamW-style</text>
<text x="730" y="612" font-size="10.5" font-weight="400" fill="#334155" text-anchor="start">• loss recorded per epoch</text>
<rect x="1039" y="474" width="306" height="220" rx="14" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
<text x="1055" y="500" font-size="14.5" font-weight="700" fill="#1e3a8a" text-anchor="start">Robustness</text>
<text x="1055" y="519" font-size="10.5" font-weight="400" fill="#334155" text-anchor="start" font-style="italic">works on small or odd inputs</text>
<text x="1055" y="544" font-size="10.5" font-weight="400" fill="#334155" text-anchor="start">• kernel shrinks to fit tiny images</text>
<text x="1055" y="561" font-size="10.5" font-weight="400" fill="#334155" text-anchor="start">• pooling skipped when the map</text>
<text x="1055" y="578" font-size="10.5" font-weight="400" fill="#334155" text-anchor="start">• is already too small</text>
<text x="1055" y="595" font-size="10.5" font-weight="400" fill="#334155" text-anchor="start">• fit-time mean / std reused</text>
<text x="1055" y="612" font-size="10.5" font-weight="400" fill="#334155" text-anchor="start">• at prediction time</text>
<rect x="64" y="712" width="1282" height="84" rx="14" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
<text x="705.0" y="738" font-size="14" font-weight="700" fill="#14532d" text-anchor="middle">Result on MNIST (5k train / 1k test, 5 epochs)</text>
<text x="705.0" y="757" font-size="10.5" font-weight="400" fill="#166534" text-anchor="middle" font-style="italic">accuracy 0.950 vs 0.931 for scikit-learn's MLPClassifier on flattened pixels (scikit-learn has no CNN)</text>
<text x="705.0" y="782" font-size="10.5" font-weight="400" fill="#334155" text-anchor="middle">from examples/compare_with_sklearn.py, as recorded in the README results table</text>
</svg>
